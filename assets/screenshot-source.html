<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  background:linear-gradient(135deg,#8ea3c4 0%,#6d84ab 45%,#56708f 100%);height:560px;position:relative;}
.menubar{height:38px;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;padding:0 16px;gap:22px;color:#fff;}
.menubar svg{width:20px;height:20px;opacity:.9;}
.mb-our{position:relative;color:#fff;}
.mb-our svg{width:22px;height:22px;}
.mb-our::after{content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);
  border:8px solid transparent;border-top-color:#fff;z-index:3;}
.pop{position:absolute;top:52px;left:50%;transform:translateX(-50%);width:440px;background:#fff;
  border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.4);padding:15px;color:#1d1d1f;}
.fl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#6e6e73;margin-bottom:7px;}
.fl svg{width:13px;height:13px;}
.fl .r{margin-left:auto;font-weight:400;font-size:10px;}
.inp{border:2px solid #0071e3;border-radius:9px;padding:10px 12px;font-size:12.5px;min-height:62px;
  box-shadow:0 0 0 3px rgba(0,113,227,.18);font-family:ui-monospace,Menlo,monospace;}
.st{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#6e6e73;margin:10px 2px;}
.gd{width:7px;height:7px;border-radius:50%;background:#1f9d55;}
.st .r{margin-left:auto;font-size:10px;color:#9a9aa0;}
.big{background:#0071e3;color:#fff;text-align:center;border-radius:9px;padding:12px;font-size:14px;font-weight:600;margin:4px 0 12px;
  display:flex;align-items:center;justify-content:center;gap:7px;}
.big svg{width:16px;height:16px;}
.rc{border-radius:10px;padding:11px 12px;margin:8px 0;display:flex;gap:9px;align-items:flex-start;}
.rc.win{background:#eaf7df;} .rc.mac{background:#eef4ff;}
.rc .ic{width:16px;height:16px;flex:0 0 16px;margin-top:1px;}
.rc h{display:block;font-size:11px;font-weight:700;margin-bottom:3px;}
.rc.win h{color:#1f9d55;} .rc.mac h{color:#0071e3;}
.rc p{font-size:11.5px;font-family:ui-monospace,Menlo,monospace;word-break:break-all;line-height:1.5;}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:#6e6e73;margin-top:13px;padding-top:11px;border-top:1px solid #e5e5ea;}
.ck{display:inline-flex;gap:6px;align-items:center;}
.box{width:14px;height:14px;border-radius:4px;background:#0071e3;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;}
</style></head><body>
<div class="menubar">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 0 1 16 0M7 12a5 5 0 0 1 10 0"/><circle cx="12" cy="17" r="1.4" fill="currentColor"/></svg>
  <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5" opacity=".7"/></svg>
  <span class="mb-our"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v2"/><path d="M3 8v9a2 2 0 0 0 2 2h6"/>
    <circle cx="17.5" cy="17.5" r="2.6"/><path d="M12.6 16.6 15 15.4M19.6 15.6 10 19M20 19.6l-4 1.4" stroke-linecap="round"/></svg></span>
  <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="9" r="3" opacity=".7"/><circle cx="16" cy="15" r="3" opacity=".7"/></svg>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12h16M4 6h16M4 18h10"/></svg>
</div>
<div class="pop">
  <div class="fl">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
    在这里粘贴路径<span class="r">自动识别 Windows / Mac</span></div>
  <div class="inp">\\fileserver\团队共享\项目文件\2026 计划.xlsx</div>
  <div class="st"><span class="gd"></span>检测到 Windows 路径 · 已转换为 Mac<span class="r">↵ 复制反向结果</span></div>
  <div class="big"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>在 Finder 中打开</div>
  <div class="rc win">
    <svg class="ic" viewBox="0 0 24 24" fill="#1f9d55"><rect x="2" y="4" width="20" height="13" rx="2"/><rect x="8" y="19" width="8" height="1.6"/><rect x="5" y="21" width="14" height="1.6"/></svg>
    <div><h>WINDOWS</h><p>\\fileserver\团队共享\项目文件\2026 计划.xlsx</p></div></div>
  <div class="rc mac">
    <svg class="ic" viewBox="0 0 24 24" fill="#0071e3"><rect x="2" y="4" width="20" height="13" rx="2"/><rect x="8" y="19" width="8" height="1.6"/><rect x="5" y="21" width="14" height="1.6"/></svg>
    <div><h>MAC</h><p>smb://fileserver/%E5%9B%A2%E9%98%9F%E5%85%B1%E4%BA%AB/…/2026%20%E8%AE%A1%E5%88%92.xlsx</p></div></div>
  <div class="foot"><span class="ck"><span class="box">✓</span>开机启动</span><span>退出</span></div>
</div>
</body></html>
